name: Banco

on:
  push:
    branches: [main]
    paths: ['supabase/**']
  pull_request:
    paths: ['supabase/**']
  workflow_dispatch:
    inputs:
      target:
        description: 'Onde aplicar as migrations'
        type: choice
        options: [test, prod]
        default: test

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Migrations e testes num banco descartável
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          psql -v ON_ERROR_STOP=1 -q \
            -f supabase/tests/00_supabase_stub.sql \
            $(ls supabase/migrations/*.sql | sort | sed 's/^/-f /') \
            -f supabase/tests/core_schema_test.sql

  deploy:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.target || 'test' }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 3.1.0
      - name: Conferir se o projeto corresponde ao ambiente
        env:
          REF: ${{ vars.SUPABASE_PROJECT_REF }}
          TARGET: ${{ github.event_name == 'workflow_dispatch' && inputs.target || 'test' }}
        run: |
          name=$(supabase projects list --output json | jq -r --arg r "$REF" '.[] | select(.id == $r or .ref == $r) | .name')
          echo "Ambiente: $TARGET · Projeto: $name ($REF)"
          if [[ "$name" != *"-$TARGET" ]]; then
            echo "::error::O projeto $name não corresponde ao ambiente $TARGET. Corrija a variável SUPABASE_PROJECT_REF do ambiente."
            exit 1
          fi
      - name: Aplicar migrations
        run: |
          supabase link --project-ref "${{ vars.SUPABASE_PROJECT_REF }}"
          supabase db push --remote --yes
      - name: Publicar Edge Functions
        run: supabase functions deploy --use-api --yes
